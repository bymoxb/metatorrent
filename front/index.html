<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>MetaTorrent — Torrent & Magnet Metadata Inspector</title>
  <meta name="title" content="MetaTorrent — Torrent & Magnet Metadata Inspector" />
  <meta name="description"
    content="MetaTorrent is a lightweight, dark-mode web tool to instantly inspect magnet links and torrent hashes. View file lists, size, trackers, and real-time health (seeds/peers) without downloading the content." />

  <meta name="keywords"
    content="MetaTorrent, torrent inspector, magnet link analyzer, torrent metadata, torrent file list, seeds and peers checker, bittorrent, trackers list, magnet hash, React, Tailwind CSS" />

  <meta name="author" content="bymoxb" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://github.com/bymoxb/metatorrent" />
  <meta property="og:title" content="MetaTorrent — Torrent & Magnet Metadata Inspector" />
  <meta property="og:description"
    content="Analyze magnet links or torrent hashes instantly. Get detailed file lists, trackers, and health stats in a beautiful dark interface." />
  <meta property="og:site_name" content="MetaTorrent" />
  <meta property="og:image" content="/og-image.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://github.com/bymoxb/metatorrent" />
  <meta name="twitter:title" content="MetaTorrent — Torrent & Magnet Metadata Inspector" />
  <meta name="twitter:description"
    content="Lightweight web tool to inspect magnet links and torrent metadata before downloading. View seeds, peers, and file contents." />
  <meta name="twitter:image" content="/og-image.png" />

  <!-- GitHub Integration -->
  <meta name="github-repository" content="https://github.com/bymoxb/metatorrent" />

  <!-- Theme & Mobile UI -->
  <meta name="theme-color" content="#020617" />
  <meta name="application-name" content="MetaTorrent" />
  <meta name="apple-mobile-web-app-title" content="MetaTorrent" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>

<body class="dark:bg-gray-900">
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
